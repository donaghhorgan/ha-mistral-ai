name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync

      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files

  test:
    name: Test (${{ matrix.ha-group }})
    runs-on: ubuntu-latest

    # ha-current and ha-minimum are conflicting dependency groups, each
    # pinning a different Home Assistant version through
    # pytest-homeassistant-custom-component. uv locks a separate resolution
    # for each, so both runs are reproducible and both dependency lists live
    # in pyproject.toml rather than in this file.
    #
    # ha-minimum is the version advertised in hacs.json, so that claim is
    # backed by a passing run.
    strategy:
      fail-fast: false
      matrix:
        ha-group: [ha-current, ha-minimum]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --no-default-groups --group dev --group ${{ matrix.ha-group }}

      - name: Run tests
        run: |
          uv run --no-sync pytest

  test-latest:
    name: Test against latest Home Assistant
    runs-on: ubuntu-latest

    # The `test` matrix is bounded by uv.lock, which resolves under the
    # project's Python 3.13. Home Assistant 2026.5.0 and later require Python 3.14, so
    # the locked environment can never reach them, and without this job the
    # most recent Home Assistant releases -- the ones most users are actually
    # running -- would go untested.
    #
    # This is allowed to fail without blocking: it tracks a moving target and
    # will break when Home Assistant makes a change we have not adapted to
    # yet. That is a signal to act on, not a reason to hold up an unrelated
    # pull request. The `test` matrix jobs are the blocking ones.
    continue-on-error: true

    env:
      # Pins pytest-homeassistant-custom-component to the newest release with
      # a stable Home Assistant pin. Dependabot does not manage this, so it
      # needs bumping by hand every so often.
      PHCC_VERSION: 0.13.348 # Home Assistant 2026.7.4

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Run tests against the latest Home Assistant version
        # hassil and home-assistant-intents are needed to set up the
        # `conversation` component. The project gets them from its dev group,
        # which an isolated run does not have, so they are named here too.
        run: |
          uv run --isolated --no-project --python 3.14 \
            --with "pytest-homeassistant-custom-component==${PHCC_VERSION}" \
            --with "mistralai>=2.1.0" \
            --with PyTurboJPEG \
            --with hassil \
            --with home-assistant-intents \
            pytest tests/ -q --no-cov

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate with HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` requires an entry in the home-assistant/brands
          # repository, which is a separate submission and is only needed to
          # list in the HACS default store. This integration is installed as a
          # custom repository, so it does not apply. Every other check runs.
          ignore: brands
