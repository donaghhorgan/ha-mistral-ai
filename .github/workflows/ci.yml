name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run tests
        run: |
          uv run pytest

  test-latest:
    name: Test against latest Home Assistant
    runs-on: ubuntu-latest

    # The `test` job is bounded by uv.lock, which resolves under the project's
    # Python 3.13. Home Assistant 2026.5.0 and later require Python 3.14, so
    # the locked environment can never reach them, and without this job the
    # most recent Home Assistant releases -- the ones most users are actually
    # running -- would go untested.
    #
    # This is allowed to fail without blocking: it tracks a moving target and
    # will break when Home Assistant makes a change we have not adapted to
    # yet. That is a signal to act on, not a reason to hold up an unrelated
    # pull request. `test` and `test-minimum` are the blocking jobs.
    continue-on-error: true

    env:
      # Pins pytest-homeassistant-custom-component to the newest release with
      # a stable Home Assistant pin. Dependabot does not manage this, so it
      # needs bumping by hand every so often.
      PHCC_VERSION: 0.13.348 # Home Assistant 2026.7.4

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Run tests against the latest Home Assistant version
        run: |
          uv run --isolated --no-project --python 3.14 \
            --with "pytest-homeassistant-custom-component==${PHCC_VERSION}" \
            --with "mistralai>=2.1.0" \
            --with PyTurboJPEG \
            pytest tests/ -q --no-cov

  test-minimum:
    name: Test against minimum supported Home Assistant
    runs-on: ubuntu-latest

    # The `test` job runs against whatever Home Assistant version
    # pytest-homeassistant-custom-component currently pins, which is always
    # recent. This job runs the same suite against the oldest version we claim
    # to support in hacs.json, so that claim is backed by a passing run.
    #
    # It cannot use uv.lock: pytest-homeassistant-custom-component pins Home
    # Assistant to an exact version, and a lockfile holds a single resolution,
    # so the floor has to be installed outside the project environment.
    #
    # That also means the transitive dependencies have to be named explicitly.
    # Setting up the `conversation` component on 2025.8 pulls in mutagen,
    # haffmpeg, pymicro_vad and pyspeex_noise, which newer releases of
    # pytest-homeassistant-custom-component provide for us; pycares is pinned
    # because current versions break aiodns on this Home Assistant version.
    env:
      # Pins pytest-homeassistant-custom-component to the release matching the
      # minimum Home Assistant version in hacs.json. Bump both together.
      PHCC_VERSION: 0.13.269 # Home Assistant 2025.8.0

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Run tests against the minimum Home Assistant version
        run: |
          uv run --isolated --no-project --python 3.13 \
            --with "pytest-homeassistant-custom-component==${PHCC_VERSION}" \
            --with "mistralai>=2.1.0" \
            --with PyTurboJPEG \
            --with "pycares==4.9.0" \
            --with hassil \
            --with home-assistant-intents \
            --with mutagen \
            --with ha-ffmpeg \
            --with pymicro-vad \
            --with pyspeex-noise \
            pytest tests/ -q --no-cov

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate with HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` requires an entry in the home-assistant/brands
          # repository, which is a separate submission and is only needed to
          # list in the HACS default store. This integration is installed as a
          # custom repository, so it does not apply. Every other check runs.
          ignore: brands
