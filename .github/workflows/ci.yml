name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes whatever is already running for the same ref. Never
# cancel on main, where each run is the record for a distinct commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is
# mutable: whoever controls the action can move v7 to point at different code
# after it has been reviewed, and every workflow picks it up on the next run. A
# SHA cannot be moved. The trailing comment records which version each SHA is,
# and Dependabot keeps the SHA and the comment in step.
#
# The two validator actions further down are deliberately left on a moving ref.
# The reasoning is next to each of them.
#
# Job names are load-bearing. The branch ruleset on main requires five checks
# by exact name: lint, Test (ha-current), Test (ha-minimum), Validate with
# hassfest, Validate with HACS. A required check whose name no longer matches
# does not go red -- it never reports at all, and pull requests sit waiting on
# a status that will never arrive. So every job sets `name:` explicitly rather
# than falling back to its id, which leaves the id free to be renamed. Changing
# a `name:` means changing the ruleset too.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The Python uv.lock resolves for -- see [tool.uv] environments in
          # pyproject.toml. Lint syncs the locked environment, so it runs
          # where that environment can be installed.
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml. A
        # plain `uv sync` would silently regenerate it and pass, leaving the
        # committed lockfile wrong.
        run: |
          uv sync --locked

      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files

  test:
    name: Test (ha-current)
    runs-on: ubuntu-latest

    # The locked resolution: dev plus ha-current, which pins Home Assistant
    # exactly through pytest-homeassistant-custom-component. Run with
    # --locked so a stale lockfile fails here rather than being regenerated
    # silently.
    #
    # On Python 3.14 because that Home Assistant requires it, and uv.lock is
    # resolved for nothing else. The integration's own floor, Python 3.13, is
    # Test (ha-minimum)'s to prove.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          uv run --no-sync pytest

  test-minimum:
    # Named to match the branch ruleset, which requires this check by exact
    # string. It reads like a matrix leg because it used to be one.
    name: Test (ha-minimum)
    runs-on: ubuntu-latest

    # The oldest supported Home Assistant -- the floor advertised in
    # hacs.json, so that claim is backed by a passing run. It is also the
    # only job on the oldest supported Python, requires-python in
    # pyproject.toml, since everything locked runs on a newer one.
    #
    # Resolved on the fly rather than locked, which is the whole point. These
    # pins are a year old and cannot move by design, and while they lived in
    # pyproject.toml three things tripped over them: Dependabot could not
    # resolve the project at all and failed silently, security alerts fired on
    # frozen versions that could only be dismissed by hand, and the dev group
    # inherited floor constraints it had no reason to carry.
    #
    # Little reproducibility is lost. pytest-homeassistant-custom-component
    # pins Home Assistant exactly, and Home Assistant pins some 46 packages
    # exactly, so the lockfile was mostly restating pins that already exist
    # upstream.
    #
    # Unlike test-latest this job blocks, and without --locked a transitive
    # re-release could break it independently of any pull request. Exposure is
    # small, but that is the trade being made.
    env:
      # HA 2025.8.0, the floor in hacs.json.
      PHCC_VERSION: 0.13.269
      # Pinned to what that Home Assistant version declares in the
      # conversation component's manifest -- they are not interchangeable
      # across releases.
      HASSIL_VERSION: 2.2.3
      INTENTS_VERSION: 2025.7.30
      # Current pycares releases break aiodns on this Home Assistant version.
      PYCARES_VERSION: 4.9.0
      # The floor declared in manifest.json and pyproject.toml. Restated here
      # because an isolated run has no project to read it from, and it drifted
      # to >=2.1.0 once already -- check_manifest_consistency.py now compares
      # the two.
      MISTRALAI_SPEC: "mistralai>=3.0.0"
      # Same reasoning as MISTRALAI_SPEC: a runtime requirement declared in
      # manifest.json, restated because an isolated run has no project to read
      # it from, and compared against the manifest by
      # check_manifest_consistency.py.
      SENTENCE_STREAM_SPEC: "sentence-stream>=1.1.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install UV
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Run tests against the oldest supported Home Assistant version
        # ha-ffmpeg, mutagen, pymicro-vad and pyspeex-noise are needed to set
        # up the conversation and tts components on this release; newer
        # releases of pytest-homeassistant-custom-component provide them. The
        # project normally gets them from its dev group, which an isolated run
        # does not have, so they are named here -- the same arrangement as
        # test-latest below.
        #
        # --python is not optional. uv reads .python-version even with
        # --no-project, and that names the locked Python (3.14), on which this
        # Home Assistant's dependencies do not even build.
        run: |
          uv run --isolated --no-project --python 3.13 \
            --with "pytest-homeassistant-custom-component==${PHCC_VERSION}" \
            --with "hassil==${HASSIL_VERSION}" \
            --with "home-assistant-intents==${INTENTS_VERSION}" \
            --with "pycares==${PYCARES_VERSION}" \
            --with "${MISTRALAI_SPEC}" \
            --with "${SENTENCE_STREAM_SPEC}" \
            --with PyTurboJPEG \
            --with ha-ffmpeg \
            --with mutagen \
            --with pymicro-vad \
            --with pyspeex-noise \
            pytest tests/ -q --no-cov

  test-latest:
    name: Test against latest Home Assistant
    runs-on: ubuntu-latest

    # Test (ha-current) is pinned to a stable Home Assistant release, and
    # moving that pin is a deliberate change. This job instead takes the
    # newest pytest-homeassistant-custom-component on every run, which often
    # pins a beta -- so it is the early warning for the Home Assistant release
    # after the one we test against, while there is still time to adapt.
    #
    # It earns its keep: Home Assistant 2026.9 swapped voluptuous for
    # probatio, and the schema converter this integration used turned tool
    # definitions and AI task structures into a placeholder that could not be
    # serialised, so every turn with tools failed. Nothing noticed, because
    # this job was pinned to 2026.7.4 at the time.
    #
    # This is allowed to fail without blocking: it tracks a moving target and
    # will break when Home Assistant makes a change we have not adapted to
    # yet. That is a signal to act on, not a reason to hold up an unrelated
    # pull request. Test (ha-current) and Test (ha-minimum) are the blocking
    # ones.
    continue-on-error: true

    env:
      # As above: the declared floor, kept honest by
      # check_manifest_consistency.py.
      MISTRALAI_SPEC: "mistralai>=3.0.0"
      # Same reasoning as MISTRALAI_SPEC: a runtime requirement declared in
      # manifest.json, restated because an isolated run has no project to read
      # it from, and compared against the manifest by
      # check_manifest_consistency.py.
      SENTENCE_STREAM_SPEC: "sentence-stream>=1.1.0"
      # Also from manifest.json. Home Assistant itself depended on this until
      # 2026.9, so the other jobs get it for free; from 2026.9 on, only the
      # manifest brings it in, and an isolated run has no manifest install.
      VOLUPTUOUS_OPENAPI_SPEC: "voluptuous-openapi>=0.2.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Run tests against the latest Home Assistant version
        # These are all needed to import or set up Home Assistant components
        # this integration builds on: gazetteer-matcher, hassil and
        # home-assistant-intents for `conversation`, mutagen and ha-ffmpeg for
        # `tts`, which imports both at module level. The project gets them
        # from its dev and ha-current groups, which an isolated run does not
        # have, so they are named here too. Adding a platform means checking
        # whether this list needs another entry -- nothing else will tell you
        # until this job goes red.
        #
        # The homeassistant requirement constrains nothing; its job is the
        # `b0`. uv only takes a pre-release for a package whose own
        # requirement names one, so without it a harness pinning a Home
        # Assistant beta fails to resolve and uv falls back to an older one.
        # --prerelease allow would work too, but would let every other
        # package drift onto pre-releases as well, and this job is meant to
        # move with Home Assistant alone.
        run: |
          uv run --isolated --no-project --python 3.14 \
            --with pytest-homeassistant-custom-component \
            --with "homeassistant>=2025.8.0b0" \
            --with "${MISTRALAI_SPEC}" \
            --with "${SENTENCE_STREAM_SPEC}" \
            --with "${VOLUPTUOUS_OPENAPI_SPEC}" \
            --with PyTurboJPEG \
            --with gazetteer-matcher \
            --with hassil \
            --with home-assistant-intents \
            --with mutagen \
            --with ha-ffmpeg \
            pytest tests/ -q --no-cov

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately not SHA-pinned. hassfest checks the manifest against Home
      # Assistant's *current* requirements, so pinning it freezes the rules it
      # enforces and the job quietly stops testing the thing it exists to
      # test. Upstream has tagged exactly once, years ago, so there is no
      # release for Dependabot to bump towards either.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate with HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not SHA-pinned either, for the same reason: it validates against what
      # HACS requires today, and HACS documents @main as the supported way to
      # use it. A pin would test yesterday's rules.
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` requires an entry in the home-assistant/brands
          # repository, which is a separate submission and is only needed to
          # list in the HACS default store. This integration is installed as a
          # custom repository, so it does not apply. Every other check runs.
          ignore: brands
