name: Release

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  release:
    name: Publish release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the committed version matches the tag
        # This used to rewrite the manifest to match the tag, on the belief
        # that HACS reads the version from the archive attached here. It does
        # not: hacs.json sets no zip_release, and without it HACS installs the
        # repository source at the tagged ref and never looks at release
        # assets. So the rewrite reached manual installers only, and a HACS
        # user tagging v1.2.0 without committing the bump would have been
        # given a manifest still saying 1.0.0 -- two version claims for one
        # install, with bug reports quoting whichever they happened to see.
        #
        # Checking rather than rewriting keeps one source of truth. The
        # committed version is the version; check_manifest_consistency.py
        # already ties manifest.json to pyproject.toml, and this extends the
        # same rule to the tag. A forgotten bump now fails the release loudly
        # instead of being papered over for one audience out of two.
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json,pathlib; print(json.loads(pathlib.Path('custom_components/mistral_ai/manifest.json').read_text())['version'])")

          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the committed"\
                 "manifest version ${manifest}. Bump the version in"\
                 "pyproject.toml and manifest.json, merge that, then retag."
            exit 1
          fi

          echo "Tag and committed manifest agree on ${version}."

      - name: Build the release archive
        run: |
          cd custom_components/mistral_ai
          zip -r ../../mistral_ai.zip .

      - name: Attach the archive to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: mistral_ai.zip
