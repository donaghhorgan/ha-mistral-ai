name: Release

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  release:
    name: Publish release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the version in the manifest
        # HACS reads the version from the manifest, so it must match the tag.
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'PY'
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          path = pathlib.Path("custom_components/mistral_ai/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=4) + "\n")
          PY

      - name: Build the release archive
        run: |
          cd custom_components/mistral_ai
          zip -r ../../mistral_ai.zip .

      - name: Attach the archive to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: mistral_ai.zip
