name: OpenAPI drift
permissions:
  contents: read

on:
  schedule:
    # Weekly, Monday morning. Nothing here is urgent -- the point is that a
    # change in the API is noticed at all, rather than the next time someone
    # happens to run a request by hand.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  drift:
    name: OpenAPI drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Regenerate from the live spec and see whether anything we depend on
      # moved. The fixture is trimmed to the eight endpoints this integration
      # calls, so a diff here is a change to something we actually use rather
      # than noise from the other 205.
      - name: Regenerate the fixture from the published spec
        run: uv run python scripts/update_openapi_fixture.py

      - name: Report any drift
        run: |
          if git diff --quiet -- tests/fixtures/openapi.json; then
            echo "No change to any endpoint this integration calls."
            exit 0
          fi

          echo "::error::The Mistral OpenAPI spec has changed for an endpoint this integration calls."
          echo
          echo "Run this locally, review the diff, and commit it:"
          echo
          echo "    uv run python scripts/update_openapi_fixture.py"
          echo
          echo "The request tests validate against this fixture, so until it is"
          echo "updated they are checking against a spec that no longer matches"
          echo "the API. If a bound has tightened, the tests will say so once"
          echo "the fixture is refreshed -- which is the point of this job."
          echo
          git --no-pager diff -- tests/fixtures/openapi.json
          exit 1
