version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # pytest-homeassistant-custom-component pins Home Assistant and the
      # whole pytest stack to exact versions, so these have to move together.
      test-stack:
        patterns:
          - pytest-homeassistant-custom-component
          - homeassistant
    ignore:
      # These are not ours to choose. Each Home Assistant release pins them
      # exactly in the conversation component's manifest, and the pins differ
      # between the versions we test: 2026.2.3 wants hassil 3.5.0 while
      # 2025.8.0 wants 2.2.3. They are pinned per group in pyproject.toml to
      # match, and move only when the Home Assistant version does. Bumping
      # them on their own upstream release schedule breaks the build --
      # hassil 3.11 dropped hassil.fuzzy, which Home Assistant 2026.2
      # imports.
      - dependency-name: hassil
      - dependency-name: home-assistant-intents
      # Same shape. pycares is pinned in ha-minimum because releases after
      # 4.9.0 removed attributes that the aiodns shipped with Home Assistant
      # 2025.8.0 references at import time:
      #
      #   AttributeError: module 'pycares' has no attribute
      #   'ares_query_a_result'
      #
      # ha-current resolves 5.0.1 quite happily, so this constrains only the
      # floor, and it lifts when the floor does.
      - dependency-name: pycares
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Without this, hook versions in .pre-commit-config.yaml drift silently.
  # That matters most for ruff, which is pinned both here and in the dev
  # group: if the two diverge, CI and local runs use different linters.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
