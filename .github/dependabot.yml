version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Update uv.lock and leave every floor alone.
    #
    # The default for a direct dependency is `increase`, which rewrites the
    # lower bound in pyproject.toml as well. That conflates two separate
    # decisions. The lock records what this was tested against; a floor
    # asserts that anything older will not work, which is a claim about what
    # the integration supports rather than an upgrade -- exactly the reason
    # homeassistant is kept off the allowlist below.
    #
    # It also arrived broken every time. The mistralai floor is restated in
    # six places, and Dependabot knows about one of them, so
    # check_manifest_consistency.py failed and every mistralai bump landed
    # with lint red and needed a hand-written follow-up commit before it
    # could merge. That was #164, and it would have been every release after
    # it.
    #
    # Two documented limitations of this strategy, neither of which reaches
    # this repository:
    #
    #   Transitive dependencies are not updated under lockfile-only for uv
    #   (dependabot-core#14073, open). The allowlist below already restricts
    #   this to named direct dependencies, so nothing transitive was in
    #   scope to lose.
    #
    #   A capped dependency can stop receiving security updates. The three
    #   pinned requirements here -- hassil, home-assistant-intents and
    #   pytest-homeassistant-custom-component -- are on the ignore list or
    #   deliberately absent already, so none of them is Dependabot's to
    #   raise either way.
    #
    # Support for versioning-strategy on the uv ecosystem was added in
    # dependabot-core#12162. Worth confirming on the Dependabot run page
    # after any change here: a rejected config fails silently, which is the
    # same failure mode the allowlist comments warn about below.
    versioning-strategy: lockfile-only
    # An allowlist, not a blocklist, because the blocklist below can never be
    # complete. Home Assistant 2026.2.3 pins 46 packages exactly and its
    # dependencies pin more beneath that, so the set of things that cannot
    # move is most of the resolution -- and it changes with every Home
    # Assistant release. Enumerating it means regenerating ~50 names each time
    # pytest-homeassistant-custom-component moves. Naming what we own instead
    # is a shorter list that does not change when Home Assistant does.
    #
    # This matters because the failure is silent. A package that cannot
    # resolve does not open a pull request that fails CI -- it fails
    # resolution, and every uv update stops until someone reads the Dependabot
    # run page.
    #
    # Deliberately absent:
    #
    #   homeassistant  the floor in [project] dependencies. It is a claim
    #                  about what we support, checked against hacs.json and
    #                  README.md, and raising it is a decision rather than an
    #                  upgrade.
    #   pytest-homeassistant-custom-component
    #                  it chooses the Home Assistant version everything is
    #                  tested against, which is a decision rather than an
    #                  upgrade. New releases are noticed by the test-latest
    #                  job in ci.yml, which resolves the newest one on every
    #                  run.
    #
    #                  This used to be pinned twice, once per Home Assistant
    #                  group, and Dependabot could not tell the floor pin from
    #                  the current one -- it raised the floor to match, which
    #                  deleted the thing that group existed to test. The floor
    #                  now lives in ci.yml and resolves on the fly, so it is
    #                  out of reach of this file entirely.
    #   pillow         we declare it for scripts/generate_brand_assets.py, but
    #                  Home Assistant pins it exactly -- 12.0.0 in 2026.2.3 --
    #                  so allowing it reproduces exactly the failure this
    #                  avoids. The floor in pyproject.toml used to be held
    #                  down to 11.3.0 by the minimum-version group; that is
    #                  gone, but the exact pin above it is not.
    #   hassil, home-assistant-intents
    #                  pinned to mirror what a given Home Assistant release
    #                  needs. These resolve fine and then break at runtime,
    #                  which is the other failure mode -- see the ignore list
    #                  below.
    #
    # Everything else we declare is here. Audited by cross-referencing the
    # declared packages against what homeassistant and
    # pytest-homeassistant-custom-component pin exactly -- 46 and 27
    # respectively, which is why the list above is short and this one is not
    # its complement.
    allow:
      - dependency-name: mistralai
      - dependency-name: sentence-stream
      - dependency-name: bandit
      # ha-ffmpeg and mutagen are needed to import homeassistant.components.tts
      # at all. Neither is pinned by Home Assistant, so both are ordinary dev
      # dependencies -- they were simply missed when added to the dev group,
      # and mutagen's floor had already drifted a release behind as a result.
      # This is the failure the allowlist trades for: silence rather than
      # breakage, but silence all the same.
      - dependency-name: ha-ffmpeg
      - dependency-name: mutagen
      - dependency-name: pre-commit
      - dependency-name: pymarkdownlnt
      - dependency-name: pyturbojpeg
      - dependency-name: ruff
      - dependency-name: toml-sort
      - dependency-name: ty
      - dependency-name: validate-pyproject
    # Kept as belt and braces while the allowlist proves itself, and because
    # each entry records why that package cannot move -- knowledge worth
    # keeping whichever mechanism enforces it.
    ignore:
      # These are not ours to choose. Each Home Assistant release pins them
      # exactly in the conversation component's manifest, and the pins differ
      # between the versions we test: 2026.2.3 wants hassil 3.5.0 while
      # 2025.8.0 wants 2.2.3. The current one is pinned in pyproject.toml to
      # match and moves only when the Home Assistant version does. Bumping
      # them on their own upstream release schedule breaks the build --
      # hassil 3.11 dropped hassil.fuzzy, which Home Assistant 2026.2
      # imports.
      #
      # pycares used to be here too, pinned to 4.9.0 because later releases
      # removed attributes the aiodns in Home Assistant 2025.8.0 reads at
      # import time. That constrained only the floor, and the floor is no
      # longer in this resolution, so the entry is gone with it.
      - dependency-name: hassil
      - dependency-name: home-assistant-intents
      # pyjwt is pinned exactly by Home Assistant itself -- PyJWT==2.10.1, in
      # both 2025.8.0 and 2026.2.3 -- rather than by a component manifest, and
      # nothing else in the tree constrains it harder than >=2.8.0. So it
      # cannot move while Home Assistant is in the resolution, and attempting
      # it does not produce a failed check, it produces a "Dependabot can't
      # resolve your Python dependency files" error with no pull request at
      # all:
      #
      #   Because homeassistant==2026.2.3 depends on pyjwt==2.10.1 and
      #   pyjwt==2.13.0, we can conclude that homeassistant==2026.2.3 cannot
      #   be used.
      #
      # It moves when Home Assistant moves.
      - dependency-name: pyjwt
      # voluptuous is the same as pyjwt -- Home Assistant pins it exactly,
      # voluptuous==0.15.2 -- with one difference: we also declare it in
      # [project] dependencies, because the integration imports it. That floor
      # is decorative. Home Assistant's exact pin always wins, and everything
      # else in the tree asks only for >=0.15, so no bump can ever resolve.
      - dependency-name: voluptuous
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Without this, hook versions in .pre-commit-config.yaml drift silently.
  # That matters most for ruff, which is pinned both here and in the dev
  # group: if the two diverge, CI and local runs use different linters.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
