[dependency-groups]
dev = [
  "bandit>=1.8.6",
  # homeassistant.components.tts imports mutagen, and reaches ffmpeg, at module
  # level -- so the TTS platform cannot even be imported without both. The
  # The ha-current release of pytest-homeassistant-custom-component does not
  # pull them in, so they are named here.
  "ha-ffmpeg>=3.2.2",
  "mutagen>=1.47.0",
  # Only used by scripts/generate_brand_assets.py. This floor used to be held
  # down to what Home Assistant 2025.8.0 pinned, because raising it made the
  # minimum-version group unresolvable. That group is gone, so the constraint
  # is lifted -- but ha-current still pins pillow exactly (12.0.0), which is
  # why Dependabot is not allowed to move it either way.
  "pillow>=11.3.0",
  "pre-commit>=4.3.0",
  "pymarkdownlnt>=0.9.32",
  "pyturbojpeg>=2.5.0",
  # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml.
  # If the two drift, `uv run ruff` and CI enforce different rules.
  "ruff>=0.16.1",
  "toml-sort>=0.23.1",
  "ty>=0.0.66",
  "validate-pyproject>=0.20.2",
]
# pytest-homeassistant-custom-component pins Home Assistant to an exact
# version, so this group chooses the version everything here is tested
# against. It is the only resolution in uv.lock -- `uv sync` gets it.
#
# The oldest supported version is tested too, but deliberately not from here:
# its pins are a year old and cannot move, and carrying them in this file made
# the project unresolvable for Dependabot and raised security alerts on
# versions frozen by design. That job resolves on the fly instead, and its
# pins live in .github/workflows/ci.yml.
ha-current = [
  "pytest-homeassistant-custom-component==0.13.316", # HA 2026.2.3
  # Pinned to what this Home Assistant version declares in the conversation
  # component's manifest. They are not interchangeable across versions:
  # hassil 3.11 dropped hassil.fuzzy, which HA 2026.2 imports.
  "hassil==3.5.0",
  "home-assistant-intents==2026.1.28",
]

[project]
name = "ha-mistral-ai"
version = "1.0.0"
description = "A Home Assistant integration that provides a conversation agent powered by Mistral AI"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13.2"
dependencies = [
  "mistralai>=2.9.0",
  "sentence-stream>=1.1.0",
  "homeassistant>=2025.8.0",
  "voluptuous>=0.13.1"
]

[tool.uv]
default-groups = ["dev", "ha-current"]

[tool.pytest.ini_options]
# The contract tests are excluded by default: they make real, billed requests
# to Mistral and need a key. `uv run pytest` stays offline and free. Run them
# with `uv run pytest tests/contract --no-cov`, or in CI.
addopts = "--cov=custom_components.mistral_ai --cov-report=term-missing --ignore=tests/contract"
asyncio_mode = "auto"
# Put the repository root on sys.path so `custom_components...` imports
# resolve without a sys.path hack in conftest.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.run]
source = ["custom_components/mistral_ai"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"] # Skip assert_used test
recursive = true

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
  ".git",
  "__pycache__",
  ".ty_cache",
  ".pytest_cache",
  "build",
  "dist",
  ".venv"
]

[tool.ruff.format]
# Use single quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line endings
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "N" # pep8-naming
]
ignore = [
  "E203", # whitespace before ':'
  "E501", # line too long (handled by ruff formatter)
  "ARG001", # unused function argument (common in Home Assistant)
  "ARG002", # unused method argument (common in Home Assistant)
  "ARG003", # unused class method argument (required by HA signatures)
  "TC002", # move third-party imports into type-checking block (can break Home Assistant)
  "N818" # exception naming (Home Assistant convention)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py files

[tool.ty.analysis]
allowed-unresolved-imports = ["**"]

[tool.ty.environment]
python-version = "3.13"
