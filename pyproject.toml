[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "hassil>=3.5.0",
  "home-assistant-intents>=2026.3.24",
  "pre-commit>=4.3.0",
  "pymarkdownlnt>=0.9.32",
  "pyturbojpeg>=2.5.0",
  "ruff>=0.13.2",
  "toml-sort>=0.23.1",
  "ty>=0.0.64",
  "validate-pyproject>=0.20.2",
]
# pytest-homeassistant-custom-component pins Home Assistant to an exact
# version, so the version we test against is chosen by picking one of these
# groups. They are declared as conflicting in [tool.uv], which makes uv lock a
# separate resolution for each, so both are reproducible.
#
# Sync one at a time: `uv sync --no-default-groups --group dev --group ha-minimum`.
# A plain `uv sync` gets dev + ha-current, per default-groups below.
ha-current = ["pytest-homeassistant-custom-component==0.13.316"] # HA 2026.2.3
ha-minimum = [
  "pytest-homeassistant-custom-component==0.13.269", # HA 2025.8.0, the floor in hacs.json
  # Setting up the conversation component on 2025.8 needs these; newer
  # releases of pytest-homeassistant-custom-component provide them for us.
  "ha-ffmpeg",
  "mutagen",
  "pymicro-vad",
  "pyspeex-noise",
  # Current pycares releases break aiodns on this Home Assistant version.
  "pycares==4.9.0",
]

[project]
name = "ha-mistral-conversation"
version = "1.0.0"
description = "A Home Assistant integration that provides a conversation agent powered by Mistral AI"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13.2"
dependencies = [
  "mistralai>=2.1.0",
  "homeassistant>=2025.8.0",
  "voluptuous>=0.13.1"
]

[tool.uv]
conflicts = [
  [
    { group = "ha-current" },
    { group = "ha-minimum" }
  ]
]
default-groups = ["dev", "ha-current"]

[tool.pytest.ini_options]
addopts = "--cov=custom_components.mistral_conversation --cov-report=term-missing"
asyncio_mode = "auto"
# Put the repository root on sys.path so `custom_components...` imports
# resolve without a sys.path hack in conftest.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.run]
source = ["custom_components/mistral_conversation"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"] # Skip assert_used test
recursive = true

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
  ".git",
  "__pycache__",
  ".ty_cache",
  ".pytest_cache",
  "build",
  "dist",
  ".venv"
]

[tool.ruff.format]
# Use single quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line endings
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "N" # pep8-naming
]
ignore = [
  "E203", # whitespace before ':'
  "E501", # line too long (handled by ruff formatter)
  "ARG001", # unused function argument (common in Home Assistant)
  "ARG002", # unused method argument (common in Home Assistant)
  "ARG003", # unused class method argument (required by HA signatures)
  "TC002", # move third-party imports into type-checking block (can break Home Assistant)
  "N818" # exception naming (Home Assistant convention)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.mistral_conversation"]
known-third-party = ["homeassistant"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py files

[tool.ty.analysis]
allowed-unresolved-imports = ["**"]

[tool.ty.environment]
python-version = "3.13"
