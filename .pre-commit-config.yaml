repos:
  # TOML sorting and formatting
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.4
    hooks:
      - id: toml-sort-fix
        name: Sort TOML files
        args: [--no-sort-tables]

  # Ruff for Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Run the formatter
      - id: ruff-format
        name: Ruff Format
        args: [--check, --diff]
      # Run the linter (includes import sorting)
      - id: ruff
        name: Ruff Lint
        args: [--fix]

  # Bandit for security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: Bandit Security Check
        args: [-r, custom_components/, scripts/]
        pass_filenames: false

  # PyMarkdown for Markdown linting
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      - id: pymarkdown
        name: PyMarkdown Lint
        # --config is required: pymarkdown does not read config from
        # pyproject.toml by default, so without it these rules are silently
        # ignored. It cannot read pyproject.toml itself either, because it
        # flattens every key and rejects ruff's "__init__.py" per-file-ignore.
        args: [--config, .pymarkdown.json, scan]
        files: \.md$

  # Local hooks
  - repo: local
    hooks:
      - id: python-version-consistency
        name: Check Python Version Consistency
        entry: python scripts/check_python_version_consistency.py
        language: system
        files: ^(pyproject\.toml|\.python-version|\.devcontainer\.json|\.github/workflows/.*\.yml)$
        pass_filenames: false
      - id: intent-pin-consistency
        name: Check Intent Pin Consistency
        entry: uv run python scripts/check_intent_pin_consistency.py
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: dependabot-coverage
        name: Check Dependabot Coverage
        entry: python scripts/check_dependabot_coverage.py
        language: system
        files: ^(pyproject\.toml|\.github/dependabot\.yml)$
        pass_filenames: false
      - id: translation-consistency
        name: Check Translation Consistency
        entry: python scripts/check_translation_consistency.py
        language: system
        files: ^custom_components/.*/translations/.*\.json$
        pass_filenames: false
      - id: ha-version-consistency
        name: Check HA Version Consistency
        entry: python scripts/check_ha_version_consistency.py
        language: system
        files: ^(hacs\.json|pyproject\.toml|README\.md)$
        pass_filenames: false
      - id: validate-pyproject
        name: Validate pyproject.toml
        entry: uv run validate-pyproject
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
      - id: sync-manifest
        name: Check Manifest Consistency
        entry: python scripts/check_manifest_consistency.py
        language: system
        files: ^(pyproject\.toml|custom_components/.*/manifest\.json|\.github/workflows/ci\.yml)$
        pass_filenames: false
      - id: ty-check
        name: Ty Type Check
        entry: uv run ty check custom_components/ scripts/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # Additional general hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: Fix End of Files
      - id: check-yaml
        name: Check YAML
      - id: check-json
        name: Check JSON
      - id: check-toml
        name: Check TOML
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Debug Statements (Python)
